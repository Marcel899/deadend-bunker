<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEAD END: Underground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=1794550000">
<link rel="stylesheet" href="css/overworld.css?v=1794550000">

<link rel="stylesheet" href="css/rooms.css?v=1794550000">

<body>

<!-- ============ MAIN MENU ============ -->
<div id="menu-screen" class="screen">
  <div class="menu-bg" aria-hidden="true"></div>
  <div class="menu-vignette" aria-hidden="true"></div>
  <div class="menu-card panel">
    <img class="logo-img" src="assets/ui/logo.png" alt="DEAD END: Underground">
    <p class="tagline">The surface is lost. Dig down, build a shelter, keep the lights on — and hold the gate.</p>
    <div class="menu-buttons">
      <button class="menu-btn primary" data-action="continueGame" id="btn-continue"><img class="ico" src="assets/icons/home.png" alt=""><span><b>Continue</b><small></small></span></button>
      <button class="menu-btn green" data-action="newGame"><img class="ico" src="assets/icons/radiation.png" alt=""><span><b>New Bunker</b><small>Three survivors, four rooms, a plank fence.</small></span></button>
      <button class="menu-btn" data-action="menuImport"><img class="ico" src="assets/icons/scroll.png" alt=""><span><b>Import Save</b><small>Paste an exported save string.</small></span></button>
    </div>
    <div class="menu-tipbox"><b>Tip</b> <span class="menu-tip"></span></div>
    <div class="menu-footer" id="menu-footer">Saves locally in your browser · v1.2</div>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game-screen" class="screen hidden">
  <header id="topbar">
    <div class="brand" data-action="openDrawer" data-drawer="settings" title="Menu & settings"><img class="ico ico-brand" src="assets/icons/radiation.png" alt=""><span>DEAD END</span></div>
    <div id="resbar"></div>
    <div id="chips"></div>
  </header>

  <div id="layout">
    <main id="bunker-wrap"><div id="bunker"></div></main>
    <aside id="sidepanel" class="panel"></aside>
    <div id="drawer" class="hidden">
      <div class="drawer-head"><h2 id="drawer-title"></h2><button class="btn close" data-action="closeDrawer" title="Close">✕</button></div>
      <div id="drawer-body"></div>
    </div>
  </div>

  <nav id="bottombar">
    <button class="nav-btn" data-action="closeDrawer" data-nav="bunker"><img class="ico" src="assets/icons/home.png" alt=""><span>Bunker</span></button>
    <button class="nav-btn" data-action="openDrawer" data-drawer="survivors" data-nav="survivors"><img class="ico" src="assets/icons/group.png" alt=""><span>Survivors</span></button>
    <button class="nav-btn" data-action="openDrawer" data-drawer="research" data-nav="research"><img class="ico" src="assets/icons/flask.png" alt=""><span>Research</span></button>
    <button class="nav-btn" data-action="openDrawer" data-drawer="excavate" data-nav="excavate"><img class="ico" src="assets/icons/pickaxe.png" alt=""><span>Excavate</span></button>
    <button class="nav-btn" data-action="openDrawer" data-drawer="defense" data-nav="defense"><img class="ico" src="assets/icons/shield.png" alt=""><span>Defense</span></button>
    <button class="nav-btn" data-action="openDrawer" data-drawer="expeditions" data-nav="expeditions"><img class="ico" src="assets/icons/truck.png" alt=""><span>Expeditions</span></button>
    <button class="nav-btn" data-action="openDrawer" data-drawer="economy" data-nav="economy"><img class="ico" src="assets/icons/chart.png" alt=""><span>Stats</span></button>
    <button class="nav-btn" data-action="openDrawer" data-drawer="legacy" data-nav="legacy"><img class="ico" src="assets/icons/trophy.png" alt=""><span>Legacy</span></button>
    <button class="nav-btn" data-action="openDrawer" data-drawer="settings" data-nav="settings"><img class="ico" src="assets/icons/gear.png" alt=""><span>Settings</span></button>
  </nav>

  <div id="toasts"></div>
  <div id="floaters"></div>
</div>

<div id="modal-root" class="hidden"></div>
