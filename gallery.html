<!doctype html><html><head><meta charset="utf-8"><title>Rig gallery</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/rigs.css">
<style>body{background:#3a3a4a;padding:10px}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.row div{text-align:center;color:#fff;font:12px sans-serif}</style></head>
<body><div class="row" id="z"></div><div class="row" id="c"></div><div class="row" id="a"></div>
<script src="js/data/sprites.js"></script><script src="js/ui/chars.js"></script>
<script>
const q=new URLSearchParams(location.search);const anim=q.get('anim')||'idle';const H=+(q.get('h')||130);const only=q.get('only');
document.getElementById('z').innerHTML=Object.keys(DE.Chars.ZOMBIES).filter(k=>!only||only.includes(k)).map(k=>`<div>${DE.Chars.zombie(k,{anim,h:H})}<br>${k}</div>`).join('');
document.getElementById('c').innerHTML=Object.keys(DE.Chars.CREW).filter(k=>!only||only.includes(k)).map(k=>`<div>${DE.Chars.crew(k,{anim,h:H})}<br>${k}</div>`).join('');
document.getElementById('a').innerHTML=['idle','walk','run','attack','hit','die','work','carry','repair','shoot','interact'].map(a=>`<div>${DE.Chars.crew('soldier',{anim:a,h:110})}${DE.Chars.zombie('walker',{anim:a,h:110})}<br>${a}</div>`).join('');
</script></body></html>
